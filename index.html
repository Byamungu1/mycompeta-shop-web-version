    <script>
      // Legacy asset resolver: the ported screens still call
      // require('../../assets/imgs/logo.png'). Map those to the URLs the
      // dev server actually serves (assets/ is mounted at the site root).
      window.require = function (assetPath) {
        var p = String(assetPath).replace(/\\/g, '/');
        var marker = 'assets/';
        var i = p.lastIndexOf(marker);
        if (i !== -1) p = p.slice(i + marker.length);
        p = p.replace(/^imgs\//, 'images/');
        return '/' + p.replace(/^\/+/, '');
      };
    </script>
