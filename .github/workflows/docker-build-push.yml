name: Docker Compose CI/CD to GitHub Container Registry

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-compose-test:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create .env file
        run: |
          echo "REGISTRY=ghcr.io" >> .env
          echo "IMAGE_NAME=${{ github.repository }}" >> .env
          echo "IMAGE_TAG=${{ needs.build-and-push.outputs.image-tag }}" >> .env
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" >> .env
          echo "VITE_CART_STORAGE_KEY=${{ secrets.VITE_CART_STORAGE_KEY }}" >> .env
          echo "VITE_DIRECT_BUY_STORAGE_KEY=${{ secrets.VITE_DIRECT_BUY_STORAGE_KEY }}" >> .env
          echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}" >> .env
          echo "VITE_GOOGLE_REDIRECT_URL=${{ secrets.VITE_GOOGLE_REDIRECT_URL }}" >> .env
          echo "NODE_ENV=production" >> .env

      - name: Pull built image
        if: github.event_name != 'pull_request'
        run: docker-compose pull

      - name: Build image locally for PR testing
        if: github.event_name == 'pull_request'
        run: docker-compose build

      - name: Run Docker Compose
        run: docker-compose up -d

      - name: Wait for container to be ready
        run: |
          timeout 60s bash -c '
            until docker-compose ps | grep -q "running"; do
              echo "Waiting for container to start..."
              sleep 3
            done
          '

      - name: Test application
        run: curl -f http://localhost:3000 || exit 1

      - name: Container Logs on Failure
        if: failure()
        run: docker-compose logs

      - name: Stop Docker Compose
        if: always()
        run: docker-compose down -v

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push, docker-compose-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read

    steps:
      - name: Trigger Render Deployment
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"