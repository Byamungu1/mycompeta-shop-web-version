server {
    listen 10000;
    server_name localhost;

    port_in_redirect off;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # 1. API Routing
    location /api/ {
        proxy_pass https://mycometashopbackend-v1.onrender.com/api/;
        proxy_set_header Host mycometashopbackend-v1.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
    }

    # 2. Django Admin Routing
    location /admin/ {
        proxy_pass https://mycometashopbackend-v1.onrender.com/admin/;
        proxy_set_header Host mycometashopbackend-v1.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
    }

    # ---------------------------------------------------------------
    # Django Static Files (CSS/JS for Admin Panel & DRF Browsable API)
    # ---------------------------------------------------------------
    location /static/ {
        set $backend_static "https://mycometashopbackend-v1.onrender.com/static/";
        proxy_pass $backend_static;

        proxy_ssl_server_name on;
        proxy_ssl_name mycometashopbackend-v1.onrender.com;
        proxy_set_header Host mycometashopbackend-v1.onrender.com;
        
        # Caching for backend static files
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ---------------------------------------------------------------
    # Django Media Files (User-Uploaded Product Images)
    # ---------------------------------------------------------------
    location /media/ {
        set $backend_media "https://mycometashopbackend-v1.onrender.com/media/";
        proxy_pass $backend_media;

        proxy_ssl_server_name on;
        proxy_ssl_name mycometashopbackend-v1.onrender.com;
        proxy_set_header Host mycometashopbackend-v1.onrender.com;
        
        # Caching for product images
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # 3. SEO Static Files
    location = /robots.txt {
        try_files $uri /robots.txt;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /sitemap.xml {
        try_files $uri /sitemap.xml;
        add_header Cache-Control "public, max-age=86400";
    }

    # 4. React SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}