server {
    listen 10000;
    server_name localhost;

    # Defers DNS resolution to request time so Nginx starts without crashing
    # even if the upstream isn't resolvable yet at boot.
    resolver 10.254.0.1 8.8.8.8 valid=10s ipv6=off;

    port_in_redirect off;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Backend target (single source of truth) ----
    # Change this ONE value if the backend service is ever renamed or moved.
    set $backend_host "mycompetashopbackend-v1.onrender.com";

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Allow larger uploads (product images, etc.) — adjust as needed
    client_max_body_size 20m;

    # ---------------------------------------------------------------
    # 1. API Routing
    # ---------------------------------------------------------------
    location /api/ {
        set $backend_api "https://${backend_host}/api/";
        proxy_pass $backend_api;

        proxy_http_version 1.1;

        # --- SNI fix: without this, TLS handshake to onrender.com fails ---
        proxy_ssl_server_name on;
        proxy_ssl_name $backend_host;

        # --- Host header fix: must match backend's own domain or          --
        # --- Render/Cloudflare's edge rejects with 403 (cert/host mismatch) --
        proxy_set_header Host $backend_host;

        # Preserve real client + original frontend info for Django
        # (needed for CSRF_TRUSTED_ORIGINS / ALLOWED_HOSTS / CORS logic)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Original-Host $host;
        proxy_set_header Connection "";

        # Reasonable timeouts so slow/cold-starting free-tier backends
        # don't produce confusing instant 502s
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Don't let nginx cache a bad upstream response as if it were fine
        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_down;
    }

    # ---------------------------------------------------------------
    # 2. Django Admin Routing
    # ---------------------------------------------------------------
    location /admin/ {
        set $backend_admin "https://${backend_host}/admin/";
        proxy_pass $backend_admin;

        proxy_http_version 1.1;

        proxy_ssl_server_name on;
        proxy_ssl_name $backend_host;

        proxy_set_header Host $backend_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Original-Host $host;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_down;
    }

    # Friendly JSON instead of a raw nginx 502 HTML page, so the frontend
    # can detect "backend unreachable" distinctly from a real API error.
    location @backend_down {
        default_type application/json;
        return 503 '{"error":"backend_unavailable","message":"The backend service is temporarily unreachable. Please try again shortly."}';
    }

    # ---------------------------------------------------------------
    # 3. SEO Static Files
    # ---------------------------------------------------------------
    location = /robots.txt {
        try_files $uri /robots.txt;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /sitemap.xml {
        try_files $uri /sitemap.xml;
        add_header Cache-Control "public, max-age=86400";
    }

    # ---------------------------------------------------------------
    # 4. React SPA Fallback
    # ---------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}